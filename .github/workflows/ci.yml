name: CI

# Change-management gate (SOC 2 CC8.1): every push runs the test suite and a
# dependency audit, giving a reviewable, reproducible build record. It is also the
# trigger for CD — a green run on main deploys staging then production (cd.yml).
#
# Push-only, deliberately. `pull_request` would (a) double-run every PR branch commit
# on a runner we share with other projects, and (b) execute fork-authored code on our
# own deploy host. Check runs attach to the head commit either way, so PRs still show
# CI status and branch protection still works.
on:
  push:
    branches: ['**']

# Least privilege: nothing here writes to the repo.
permissions:
  contents: read

# Superseded pushes on the same branch are pointless work on a single shared runner.
# Never cancel main: its run is what gates the production deploy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  api-tests:
    name: API tests
    # Self-hosted runner on our own host (no GitHub-hosted minutes billed). The
    # box is shared with other projects, so we must NOT hard-bind host port 6379
    # (cardsix-redis already holds it). Publish only the container port and let
    # Docker pick a free host port, read back via job.services.redis.ports below.
    runs-on: [self-hosted, linux]
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379']          # host port auto-assigned → no collision on the shared box
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_HOST: localhost
      JWT_SECRET: ci-test-jwt-secret-at-least-32-bytes-long-xx
      ENCRYPTION_KEY: ci-test-encryption-key-not-a-real-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install (reproducible)
        working-directory: api
        run: npm ci
      - name: Syntax check all source
        working-directory: api
        run: node -e "const fs=require('fs'),cp=require('child_process');function walk(d){for(const f of fs.readdirSync(d,{withFileTypes:true})){const p=d+'/'+f.name;if(f.isDirectory())walk(p);else if(f.name.endsWith('.js'))cp.execSync('node --check '+JSON.stringify(p));}}walk('src');walk('test/live');walk('test/helpers');console.log('syntax ok');"
      # test/live/ is deliberately outside `npm test` (it spends money), so
      # nothing else in CI ever parses it. Without this line a syntax error in
      # the pre-cutover schema check is found by the person running it under
      # time pressure. Free, and it needs no credentials.
      - name: Run tests
        working-directory: api
        env:
          # Docker-assigned host port for the redis service (avoids the fixed-6379
          # collision with other projects on this shared self-hosted runner).
          REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
        run: npm test

  audit:
    name: Dependency audit (advisory)
    runs-on: [self-hosted, linux]
    continue-on-error: true   # informational for now — known aging deps (multer 1.x, pdf-parse); tighten later
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: npm audit (high+)
        working-directory: api
        run: npm audit --audit-level=high

  web-mcp-syntax:
    name: Syntax check (web/, mcp/)
    # web/ and mcp/ get NO gate today: web/ is a live nginx bind mount (edits
    # ship the instant they land, no build/deploy step to catch a typo) and
    # mcp/ has no test suite. This mirrors api-tests' "Syntax check all
    # source" step for the same cheap catch — parse every .js, nothing more —
    # so a broken admin.js/portal.js/arena.js/url.js etc. fails the push
    # instead of shipping straight to prod.
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check web/ and mcp/src/
        run: node -e "const fs=require('fs'),cp=require('child_process');function walk(d){for(const f of fs.readdirSync(d,{withFileTypes:true})){const p=d+'/'+f.name;if(f.isDirectory())walk(p);else if(f.name.endsWith('.js'))cp.execSync('node --check '+JSON.stringify(p));}}walk('web');walk('mcp/src');console.log('syntax ok');"

  nginx-config:
    name: config validity (nginx, workflows)
    # proxy/nginx.conf is the only file under proxy/ that actually ships — it's
    # bind-mounted into the running container as conf.d/default.conf (see
    # docker-compose.yml). The rest of proxy/ (host-*.conf) are host-level TLS
    # vhost configs referencing /etc/letsencrypt paths that don't exist in a
    # container, so `nginx -t`-ing the whole directory doesn't work; this
    # deliberately validates only the one file that's actually deployed.
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - name: nginx -t
        run: docker run --rm -v "$PWD/proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.27-alpine nginx -t
      # Self-lint. A job-level `container:` runs as root and leaves root-owned
      # files in the workspace every job here shares, so the NEXT job's
      # actions/checkout dies with EACCES — the offending job passes and takes
      # down everything after it (that is exactly what happened on run
      # 30464769240). Parsed as YAML rather than grepped so a `container:`
      # mentioned in a comment doesn't trip it, and a real one can't hide.
      - name: No job-level `container:` (unsafe on the shared runner)
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          bad = []
          for f in sorted(glob.glob('.github/workflows/*.yml')):
              doc = yaml.safe_load(open(f)) or {}
              for job_name, job in (doc.get('jobs') or {}).items():
                  if isinstance(job, dict) and 'container' in job:
                      bad.append(f'{f}: job "{job_name}"')
          if bad:
              print('ERROR: job-level `container:` is unsafe on this self-hosted runner.')
              print('Every job shares one workspace; a container job runs as root and')
              print('leaves files the next job (running as `admin`) cannot delete, so its')
              print('actions/checkout fails with EACCES before any step runs.')
              print('Use `docker run` in a step instead — see the capture-tests job.')
              for b in bad:
                  print('  ' + b)
              sys.exit(1)
          print('workflow lint ok — no job-level container:')
          PY

  capture-tests:
    name: capture/ tests (Python)
    # capture/ (Python/FastAPI) has zero CI coverage today. Run in a
    # python:3.12-slim container (matches capture/Dockerfile's base image) so
    # nothing touches the shared runner's host Python. Scope is deliberately
    # narrow rather than a full port of api-tests: compileall catches syntax
    # errors across src/, and the two pytest files pin behavior this week's
    # fixes depend on — both fail silently-wrong (not a crash) if regressed:
    #   * _verify_svix_signature must fail CLOSED with no
    #     RECALL_AI_WEBHOOK_SECRET set (compose defaults it to empty) —
    #     otherwise /webhooks/recall is unauthenticated and replayable,
    #     letting anyone re-trigger the archive+Gemini pipeline and burn the
    #     ~$1/bot engagement meter.
    #   * _HttpxStreamReader must stream read(size) chunks, never materialise
    #     the whole recording body — capture's /tmp is a 64MB tmpfs and
    #     recordings run 1-2h / multi-GB.
    #
    # Runs python via `docker run`, NOT via a job-level `container:`. That is
    # load-bearing on a self-hosted runner: every job here shares ONE workspace
    # (_work/<repo>/<repo>), and a `container:` job runs as root, so its
    # checkout leaves root-owned files that the next job — running as the
    # `admin` service user — cannot delete. actions/checkout then dies with
    # EACCES before any step runs. That is exactly what happened on run
    # 30464769240: this job passed, then poisoned the workspace and took
    # api-tests, the audit and the web/mcp syntax check down with it.
    #
    # So: mount the source READ-ONLY and keep all writes inside the container.
    # PYTHONPYCACHEPREFIX redirects .pyc output off the mount, and pytest runs
    # with no cacheprovider so it never tries to create .pytest_cache in it.
    # Net effect: nothing this job does can touch the shared workspace.
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - name: compileall + pytest (python:3.12-slim, read-only mount)
        run: |
          docker run --rm \
            -v "$PWD/capture":/c:ro \
            -e PYTHONPYCACHEPREFIX=/tmp/pyc \
            -w /c python:3.12-slim \
            sh -c 'pip install -q -r requirements-dev.txt \
                   && python -m compileall -q src \
                   && python -m pytest tests -q -p no:cacheprovider'
